<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020617" />
  <link rel="icon" type="image/svg+xml" href="./icons/protrek-192.svg" />
  <link rel="shortcut icon" type="image/svg+xml" href="./icons/protrek-192.svg" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="dns-prefetch" href="https://api.open-meteo.com" />
  <link rel="dns-prefetch" href="https://api.weather.com" />
  <meta name="description"
    content="Calcule l'altitude réelle corrigée à partir de la pression, de la température et de l'humidité." />
  <title>Pro Trek - Calibration</title>
  <style>
    html {
      background: var(--bg);
      color-scheme: dark;
    }

    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #ef4444;
      --panel-surface: rgba(17, 24, 39, 0.95);
      --result-surface: rgba(17, 47, 90, 0.9);
      --subtle-surface: rgba(15, 23, 42, 0.65);
      --metric-surface: rgba(15, 23, 42, 0.8);
      --shadow: rgba(15, 23, 42, 0.4);
      --surface-text: #e5e7eb;
      --surface-muted: #9ca3af;
      --button-text: #062033;
      --success: #86efac;
      --status-error: #fca5a5;
      --status-info: #93c5fd;
    }

    :root[data-theme="light"] {
      --bg: #eef2f7;
      --panel: #ffffff;
      --panel-2: #e2e8f0;
      --text: #172033;
      --muted: #526174;
      --accent: #087ea4;
      --accent-2: #008523;
      --danger: #b91c1c;
      --panel-surface: rgba(255, 255, 255, 0.95);
      --result-surface: color-mix(in srgb, var(--accent) 25%, white);
      --subtle-surface: rgba(226, 232, 240, 0.7);
      --metric-surface: rgba(241, 245, 249, 0.9);
      --shadow: rgba(71, 85, 105, 0.2);
      --surface-text: #172033;
      --surface-muted: #526174;
      --button-text: #ffffff;
      --status-success: #008523;
      --status-error: #b91c1c;
      --status-info: #075985;
      color-scheme: light;
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #eef2f7;
        --panel: #ffffff;
        --panel-2: #e2e8f0;
        --text: #172033;
        --muted: #526174;
        --accent: #087ea4;
        --accent-2: #008523;
        --danger: #b91c1c;
        --panel-surface: rgba(255, 255, 255, 0.95);
        --result-surface: color-mix(in srgb, var(--accent) 25%, white);
        --subtle-surface: rgba(226, 232, 240, 0.7);
        --metric-surface: rgba(241, 245, 249, 0.9);
        --shadow: rgba(71, 85, 105, 0.2);
        --surface-text: #172033;
        --surface-muted: #526174;
        --button-text: #ffffff;
        --status-success: #008523;
        --status-error: #b91c1c;
        --status-info: #075985;
        color-scheme: light;
      }
    }

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      min-height: 100vh;
      background-color: #000;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .viewport-clipper {
      display: grid;
      place-items: center;
      background: linear-gradient(in oklab to bottom, #000, var(--accent));
    }

    .panel {
      width: clamp(480px, 50vmax, 800px);
      max-width: 99vw;
      margin-top: 2vw;
      margin-bottom: 1vw;
      background: var(--panel-surface);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 40px var(--shadow);
    }

    @media (max-width: 768px) and (orientation: portrait) {
      body {
        min-height: 100dvh;
      }

      .viewport-clipper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100dvw;
        height: 100dvh;
        overflow-y: auto;
        overflow-anchor: none;
        clip-path: inset(0 0 round clamp(16px, 10vw, 48px));
      }

      .panel {
        border-radius: clamp(16px, 10vw, 48px);
      }
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.7rem;
      cursor: pointer;
    }

    .subtitle {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.96rem;
    }

    form {
      display: grid;
      gap: 18px;
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 0.95rem;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: var(--panel-2);
      color: var(--text);
      font-size: 1rem;
    }

    input#currentAltitude {
      background-color: var(--result-surface);
    }

    input:focus {
      outline: 2px solid rgba(56, 189, 248, 0.5);
      border-color: var(--accent);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.96rem;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .primary {
      background: var(--accent);
      color: var(--button-text);
      font-weight: 700;
    }

    .secondary {
      background: rgba(148, 163, 184, 0.15);
      color: var(--text);
    }

    .status {
      min-height: 24px;
      color: var(--accent-2);
      font-size: 0.9rem;
      margin-top: 4px;
      font-weight: 600;
      line-height: 1.45;
    }

    .result-card {
      margin-top: 20px;
      padding: 18px 16px;
      border-radius: 12px;
      background: var(--result-surface);
      border: 1px solid rgba(148, 163, 184, 0.22);
      color: var(--surface-text);
    }

    .forecast-coverage {
      margin-top: 22px;
      padding: 12px 16px;
      border-left: 3px solid var(--accent);
      background: var(--subtle-surface);
      color: var(--muted);
      font-size: 0.7rem;
      line-height: 1.5;
    }

    .forecast-coverage strong {
      color: var(--text);
      font-weight: 400;
    }

    .forecast-refresh {
      margin-bottom: 8px;
      padding: 5px 9px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 6px;
      background: rgba(148, 163, 184, 0.12);
      color: var(--text);
      font-size: 0.72rem;
    }

    .forecast-refresh:hover {
      background-color: var(--accent);
      color: var(--button-text);
    }

    .result-label {
      color: var(--surface-muted);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .result-value {
      font-size: 2.1rem;
      font-weight: 700;
      margin-top: 8px;
    }

    .result-details {
      margin-top: .5rem;
      hyphens: auto;
      font-size: 0.95rem;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .metric {
      background: var(--metric-surface);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 10px;
      padding: 10px 8px;
    }

    .metric-name {
      display: block;
      color: var(--surface-muted);
      font-size: 0.7rem;
      margin-bottom: 6px;
    }

    .metric-value {
      display: block;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .version {
      color: var(--text);
      font-size: 0.7rem;
      opacity: 0.4;
      margin-bottom: 0.3rem;
    }

    .theme {
      font-variant: small-caps;
      font-size: .5rem;
      opacity: .3;
      ;
    }
  </style>
</head>

<body>
  <div class="viewport-clipper">
    <main class="panel">
      <h1 id="themeToggle" tabindex="0" role="button" aria-label="Changer de palette de couleurs"
        title="Changer de palette de couleurs">Calibration Pro Trek <sup class="theme" id="theme"></sup></h1>
      <p class="subtitle">Calcule l’altitude réelle corrigée à partir de la pression, de la température et de
        l’humidité.
      </p>

      <form id="calibrationForm">
        <label>
          Date et heure de calibration
          <input id="calibrationTime" type="datetime-local" required />
        </label>

        <label>
          Altitude réelle de calibration (m)
          <input id="calibrationAltitude" type="number" step="1" min="-100" max="5000" required />
        </label>

        <label>
          Altitude affichée par la Pro Trek (m)
          <input id="currentAltitude" type="number" step="1" min="-2000" max="5000" required />
        </label>

        <div class="actions">
          <button type="submit" class="primary">Calculer</button>
        </div>

        <div id="status" class="status" aria-live="polite"></div>
      </form>

      <div class="result-card" id="resultCard" aria-live="polite">
        <div class="result-label">Altitude réelle estimée</div>
        <div class="result-value" id="resultValue">-- m</div>

        <div class="metric-grid">
          <div class="metric">
            <span class="metric-name">Pression</span>
            <span class="metric-value" id="pressureMetric">-- m</span>
          </div>
          <div class="metric">
            <span class="metric-name">Thermique</span>
            <span class="metric-value" id="thermalMetric">-- m</span>
          </div>
          <div class="metric">
            <span class="metric-name">Hygro</span>
            <span class="metric-value" id="humidityMetric">-- m</span>
          </div>
        </div>

        <div class="result-details" id="resultDetails">Aucune correction calculée.</div>
      </div>

      <section class="forecast-coverage" id="forecastCoverage" aria-live="polite">
        <button type="button" class="forecast-refresh" id="refreshBtn">Rafraîchir prévisions</button>
        <div id="forecastCoverageText"></div>
      </section>
    </main>

    <footer class="version" id="version" aria-label="Double-clic pour mise à jour"
      ondblclick="window.location.reload();"></footer>
  </div>
  <script type="module" src="./script/main.js"></script>
</body>

</html>
